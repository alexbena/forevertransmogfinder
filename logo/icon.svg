      <path d="M200 226 L230 228 C250 242 264 262 272 290 L200 336 L128 290 C136 262 150 242 170 228 Z"/>
    </clipPath>
    <g id="bust">
      <path fill-rule="evenodd" d="M200 64 C216 78 256 90 258 132 L260 174 L270 198 L228 212 L200 215 L172 212 L130 198 L140 174 L142 132 C144 90 184 78 200 64 Z M152 132 L248 132 L244 148 L208 148 L208 202 L192 202 L192 148 L156 148 Z"/>
      <path d="M242 228 C254 212 274 204 294 207 C313 210 320 230 320 252 L320 268 C306 266 292 272 281 282 C275 260 262 242 242 228 Z"/>
      <path d="M158 228 C146 212 126 204 106 207 C87 210 80 230 80 252 L80 268 C94 266 108 272 119 282 C125 260 138 242 158 228 Z"/>
      <path d="M200 226 L230 228 C250 242 264 262 272 290 L200 336 L128 290 C136 262 150 242 170 228 Z"/>
