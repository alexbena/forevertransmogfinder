<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <title>Forever Transmog Finder</title>
  <defs>
    <!-- badge field -->
    <radialGradient id="bg" cx="200" cy="185" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#231D36"/>
      <stop offset="1" stop-color="#121318"/>
    </radialGradient>
    <!-- violet aura behind the gem -->
    <radialGradient id="aura" cx="200" cy="200" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#7C4DFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <!-- gem interior -->
    <radialGradient id="gemIn" cx="200" cy="175" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A3596"/>
      <stop offset="0.6" stop-color="#30226A"/>
      <stop offset="1" stop-color="#1A1438"/>
    </radialGradient>
    <!-- collected (lit) half -->
    <linearGradient id="lit" x1="0" y1="70" x2="0" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A6FFF4"/>
      <stop offset="0.42" stop-color="#3EDCD8"/>
      <stop offset="1" stop-color="#B9A2FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="seamGlow" x="-200%" y="-10%" width="500%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <clipPath id="badgeClip"><rect x="2" y="2" width="396" height="396" rx="84"/></clipPath>
    <clipPath id="leftHalf"><rect x="0" y="0" width="200" height="400"/></clipPath>
    <clipPath id="rightHalf"><rect x="200" y="0" width="200" height="400"/></clipPath>
    <clipPath id="gemClip"><polygon points="200,49 332.5,125.5 332.5,278.5 200,355 67.5,278.5 67.5,125.5"/></clipPath>
    <!-- helmet (with the T visor hole) and breastplate: limits the seam -->
    <clipPath id="seamClip">
      <path clip-rule="evenodd" d="M200 64 C216 78 256 90 258 132 L260 174 L270 198 L228 212 L200 215 L172 212 L130 198 L140 174 L142 132 C144 90 184 78 200 64 Z M152 132 L248 132 L244 148 L208 148 L208 202 L192 202 L192 148 L156 148 Z"/>
      <path d="M200 226 L230 228 C250 242 264 262 272 290 L200 336 L128 290 C136 262 150 242 170 228 Z"/>
    </clipPath>
    <!-- knight bust, symmetric about x=200 -->
    <g id="bust">
      <path fill-rule="evenodd" d="M200 64 C216 78 256 90 258 132 L260 174 L270 198 L228 212 L200 215 L172 212 L130 198 L140 174 L142 132 C144 90 184 78 200 64 Z M152 132 L248 132 L244 148 L208 148 L208 202 L192 202 L192 148 L156 148 Z"/>
      <path d="M242 228 C254 212 274 204 294 207 C313 210 320 230 320 252 L320 268 C306 266 292 272 281 282 C275 260 262 242 242 228 Z"/>
      <path d="M158 228 C146 212 126 204 106 207 C87 210 80 230 80 252 L80 268 C94 266 108 272 119 282 C125 260 138 242 158 228 Z"/>
      <path d="M200 226 L230 228 C250 242 264 262 272 290 L200 336 L128 290 C136 262 150 242 170 228 Z"/>
    </g>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="396" height="396" rx="84" fill="url(#bg)" stroke="#363C4A" stroke-width="3"/>
  <circle cx="200" cy="200" r="200" fill="url(#aura)" clip-path="url(#badgeClip)"/>

  <g transform="translate(0 -2)">
  <!-- gem -->
  <polygon points="200,49 332.5,125.5 332.5,278.5 200,355 67.5,278.5 67.5,125.5" fill="url(#gemIn)"/>
  <g clip-path="url(#gemClip)">
    <g clip-path="url(#rightHalf)">
      <use href="#bust" fill="#4FE6DA" opacity="0.8" filter="url(#glow)"/>
    </g>
    <!-- missing half: dark silhouette with a faint violet rim -->
    <g clip-path="url(#leftHalf)">
      <use href="#bust" fill="#0C0C14" stroke="#5A45B0" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <!-- collected half -->
    <g clip-path="url(#rightHalf)">
      <use href="#bust" fill="url(#lit)"/>
    </g>
    <path d="M222 95 C236 104 244 114 247 126" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
    <!-- glowing seam where the look is revealed -->
    <g clip-path="url(#seamClip)">
      <rect x="195" y="60" width="10" height="280" fill="#7FF5EA" filter="url(#seamGlow)" opacity="0.7"/>
      <rect x="198.5" y="60" width="3" height="280" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <!-- sparkle -->
  <path d="M298 122 Q301 147 324 152 Q301 157 298 182 Q295 157 272 152 Q295 147 298 122 Z" fill="#FFF3C4"/>

  <!-- faceted gold bezel -->
  <g stroke="#0E0F14" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="200,30 349,116 331.6,126 200,50" fill="#F7D56A"/>
    <polygon points="349,116 349,288 331.6,278 331.6,126" fill="#E6B422"/>
    <polygon points="349,288 200,374 200,354 331.6,278" fill="#A97A12"/>
    <polygon points="200,374 51,288 68.4,278 200,354" fill="#C08F1C"/>
    <polygon points="51,288 51,116 68.4,126 68.4,278" fill="#EDC24A"/>
    <polygon points="51,116 200,30 200,50 68.4,126" fill="#FFE79A"/>
  </g>
  </g>
</svg>
